# Build-only model: no runtime credentials, networks, ports, or volumes.
# compose.app.yml extends these services to keep image/build settings identical.
x-build: &build
  context: ..
  dockerfile: Dockerfile
  args:
    COMMIT: ${RAY_GIT_COMMIT:-ray-local}
    DATE: ${RAY_BUILD_DATE:-}
    NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.27.3-alpine}
    ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.21}
    POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:18-alpine}
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}

services:
  master:
    image: ${MASTER_IMAGE:-sub2api-ray:master}
    build: *build
  slave:
    image: ${SLAVE_IMAGE:-sub2api-ray:slave}
    build: *build
